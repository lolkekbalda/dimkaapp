<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>димка в поисках кента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: #0e0e11; /* Глубокий темный фон */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Легкое свечение на фоне */
        body::before {
            content: ''; position: absolute; width: 250px; height: 250px;
            background: rgba(123, 44, 191, 0.2); border-radius: 50%;
            top: -50px; left: -50px; filter: blur(70px); z-index: 0;
        }
        body::after {
            content: ''; position: absolute; width: 200px; height: 200px;
            background: rgba(255, 71, 87, 0.15); border-radius: 50%;
            bottom: -50px; right: -50px; filter: blur(70px); z-index: 0;
        }

        .header {
            width: 100%; padding: 20px; text-align: center;
            font-weight: 600; font-size: 16px; color: #a0a0a0;
            position: absolute; top: 10px; z-index: 1;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; padding: 35px 25px;
            text-align: center; width: 90%; max-width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1; animation: floatUp 0.6s ease-out;
        }

        .avatar-container {
            width: 90px; height: 90px; margin: 0 auto 20px auto;
            border-radius: 50%; background: linear-gradient(135deg, #7b2cbf, #ff4757);
            padding: 3px; box-shadow: 0 0 20px rgba(123, 44, 191, 0.4);
        }

        .avatar-inner {
            width: 100%; height: 100%; background-color: #151518;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 45px;
        }

        /* Текст в одну строчку мелким шрифтом */
        .subtitle {
            font-size: 13px; 
            color: #8a8a8a; 
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .btn {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(90deg, #ff4757, #ff6b81); 
            color: #ffffff;
            border: none; padding: 16px 20px; border-radius: 14px;
            font-size: 16px; font-weight: 800; 
            cursor: pointer; width: 100%;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.2s ease;
        }

        .btn:active { 
            transform: scale(0.97); 
            box-shadow: 0 3px 10px rgba(255, 71, 87, 0.3); 
        }

        @keyframes floatUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>
    <div class="header">димка в поисках кента</div>
    
    <div class="match-card">
        <div class="avatar-container">
            <div class="avatar-inner">👾</div>
        </div>
        
        <p class="subtitle">Сначала смех, а потом погнали</p>
        
        <button class="btn" onclick="startSearch()">Погнали флиртовать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0e0e11');
        tg.setBackgroundColor('#0e0e11');

        function startSearch() {
            if (tg.HapticFeedback) { tg.HapticFeedback.impactOccurred('medium'); }
            alert("Дима уже ищет кента! Скоро здесь появится чат.");
        }
    </script>
</body>
</html>
